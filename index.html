<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipper Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f; color: #e5e5e5;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 40px 20px;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    p { font-size: 16px; color: #888; margin-bottom: 40px; text-align: center; max-width: 480px; }
    .links { display: flex; gap: 16px; }
    .links a {
      color: #aaa; text-decoration: none; font-size: 14px;
      padding: 8px 20px; border: 1px solid #333; border-radius: 8px;
      transition: all .15s;
    }
    .links a:hover { color: #fff; border-color: #666; }
    .footer { margin-top: 60px; font-size: 12px; color: #444; }
  </style>
</head>
<body>
  <div class="logo">🎬</div>
  <h1>Clipper Studio</h1>
  <p>Internal tool for automating the publishing of short-form video clips to social media platforms.</p>
  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </div>
  <div class="footer">© 2026 Clipper Studio. All rights reserved.</div>
</body>
</html>
