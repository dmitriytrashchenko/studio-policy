<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Authorization — Clipper Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f7f7f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 40px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    text-align: center;
  }
  .logo { font-size: 32px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; color: #111; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 32px; }

  .status-ok { color: #16a34a; }
  .status-err { color: #dc2626; }

  .code-block {
    background: #f1f5f9;
    border-radius: 8px;
    padding: 16px;
    margin: 24px 0;
    text-align: left;
  }
  .code-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .code-value {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: #1e293b;
    word-break: break-all;
    line-height: 1.5;
  }
  .copy-btn {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 24px;
    background: #fe2c55;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .copy-btn:hover { background: #e0173d; }
  .copy-btn.copied { background: #16a34a; }

  .instruction {
    margin-top: 24px;
    font-size: 13px;
    color: #555;
    line-height: 1.6;
    text-align: left;
    background: #fffbeb;
    border-left: 3px solid #f59e0b;
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
  }

  .error-block {
    background: #fef2f2;
    border-radius: 8px;
    padding: 16px;
    margin: 24px 0;
    text-align: left;
    color: #dc2626;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎬</div>
  <h1 id="title">Clipper Studio</h1>
  <p class="subtitle" id="subtitle">TikTok Authorization</p>

  <div id="content"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  const errorDesc = params.get('error_description');
  const content = document.getElementById('content');

  if (code) {
    document.getElementById('title').textContent = 'Authorization Successful';
    document.getElementById('title').className = 'status-ok';
    document.getElementById('subtitle').textContent = 'Copy the code below into Clipper Studio';

    content.innerHTML = `
      <div class="code-block">
        <div class="code-label">Authorization Code</div>
        <div class="code-value" id="code-val">${code}</div>
      </div>
      <button class="copy-btn" id="copy-btn" onclick="copyCode()">Copy Code</button>
      <div class="instruction">
        Go back to <strong>Clipper Studio</strong> (localhost:5000) and paste this code
        into the TikTok authorization dialog. The code expires in a few minutes.
      </div>
    `;
  } else if (error) {
    document.getElementById('title').textContent = 'Authorization Failed';
    document.getElementById('title').className = 'status-err';
    document.getElementById('subtitle').textContent = 'Something went wrong';

    content.innerHTML = `
      <div class="error-block">
        <strong>${error}</strong><br>
        ${errorDesc ? errorDesc : 'No additional details provided.'}
      </div>
      <div class="instruction">
        Close this window and try connecting TikTok again in Clipper Studio.
      </div>
    `;
  } else {
    document.getElementById('title').textContent = 'Clipper Studio';
    document.getElementById('subtitle').textContent = 'TikTok OAuth Callback';
    content.innerHTML = `
      <div class="instruction">
        This page handles TikTok authorization redirects for Clipper Studio.<br><br>
        If you opened this page manually, please go back to Clipper Studio and
        initiate the TikTok login from there.
      </div>
    `;
  }

  function copyCode() {
    const code = document.getElementById('code-val').textContent;
    navigator.clipboard.writeText(code).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      btn.className = 'copy-btn copied';
      setTimeout(() => {
        btn.textContent = 'Copy Code';
        btn.className = 'copy-btn';
      }, 2000);
    });
  }
</script>
</body>
</html>
